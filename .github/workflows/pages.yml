name: Website

on:
  push:
    branches: [main]
    # The site, the app version (in the pages' structured data) or this workflow changed.
    paths: ['website/**', 'Directory.Build.props', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Build pages (pt-BR, en, es), sitemap and robots.txt
        shell: pwsh
        run: ./website/build.ps1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/_site
      - id: deployment
        uses: actions/deploy-pages@v4
