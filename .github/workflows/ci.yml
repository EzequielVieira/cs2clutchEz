name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build CS2DemoHighlightGenerator.sln -c Release --nologo
      # Tests that need FFmpeg or a capturable window skip themselves when those are missing.
      - name: Test
        run: dotnet test tests/CS2HG.Tests/CS2HG.Tests.csproj -c Release --no-build --nologo
