<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{pageTitle}}</title>
  <meta name="description" content="{{pageDescription}}">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="theme-color" content="#0F1115">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="{{canonical}}">
{{alternates}}
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/icon.png" type="image/png" sizes="256x256">
  <link rel="apple-touch-icon" href="/assets/icon.png">
  <meta property="og:type" content="{{ogType}}">
  <meta property="og:site_name" content="cs2clutchEz">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:title" content="{{pageOgTitle}}">
  <meta property="og:description" content="{{pageDescription}}">
  <meta property="og:locale" content="{{ogLocale}}">
{{ogLocaleAlternates}}
  <meta property="og:image" content="{{site}}/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{a:og.imageAlt}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{pageOgTitle}}">
  <meta name="twitter:description" content="{{pageDescription}}">
  <meta name="twitter:image" content="{{site}}/assets/og.png">
  <link rel="stylesheet" href="/assets/style.css">
  <script type="application/ld+json">{{jsonld}}</script>
</head>
<body>
  <a class="skip" href="#main">{{t:nav.skip}}</a>

  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="{{home}}">
        <img src="/assets/logo.svg" alt="cs2clutchEz" width="198" height="18">
      </a>
      <nav class="nav" aria-label="Menu">
        <a href="{{home}}#features">{{t:nav.features}}</a>
        <a href="{{home}}#how">{{t:nav.how}}</a>
        <a href="{{guide}}"{{guideCurrent}}>{{t:nav.guide}}</a>
        <a href="{{home}}#faq">{{t:nav.faq}}</a>
        <a href="https://github.com/EzequielVieira/cs2clutchEz" class="nav-github" rel="noopener">GitHub</a>
      </nav>
      <nav class="lang" aria-label="{{a:nav.language}}">
{{langLinks}}
      </nav>
    </div>
  </header>

  <main id="main">
{{content}}
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <p class="footer-brand"><img src="/assets/logo.svg" alt="cs2clutchEz" width="132" height="12" loading="lazy"> <span>{{t:footer.license}}</span> · <a href="{{guide}}">{{t:nav.guide}}</a> · <a href="https://github.com/EzequielVieira/cs2clutchEz" rel="noopener">GitHub</a></p>
      <p class="muted">{{t:footer.valve}}</p>
    </div>
  </footer>

  <script id="page-data" type="application/json">{{pageData}}</script>
  <script src="/assets/app.js" defer></script>
</body>
</html>
